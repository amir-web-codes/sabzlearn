name: sabzlearn
services:

  mongodb:
    image: mongo:8
    container_name: mongodb
    
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sabzlearn
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  mongo_data:
  redis_data: